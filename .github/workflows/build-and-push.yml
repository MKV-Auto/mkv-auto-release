# Build and push Docker image to GHCR. Runs in mkv-auto-release repo.
# Trigger: tag v*.*.* (created by the main repo's release workflow) or manual
# dispatch (retry a failed publish without re-tagging). NOT on push to main:
# main also receives non-release commits (e.g. site/progress.json updates),
# which must not rebuild and republish :latest.
name: Build and push to GHCR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and image name
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi
          # Docker references must be lowercase; github.repository preserves org case (MKV-Auto)
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Build frontend (production)
        run: cd Frontend && npm ci && npm run build -- --configuration=production

      # arm64 is cross-built on an amd64 runner, so binfmt emulation is required.
      # It is slow — the arm64 leg dominates release time — but correctness was
      # verified natively (see below), so emulation only has to reproduce a known
      # -good build rather than discover whether one is possible.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tags are multi-arch. Publishing an amd64-only `latest` would be
      # actively worse for ARM users than not publishing arm64 at all: they would
      # pull `latest`, receive an amd64 image and hit "exec format error". A
      # multi-arch manifest lets Docker select by host architecture.
      #
      # arm64 was validated end to end on real hardware before enabling this —
      # build, boot, MakeMKV compile, raw SCSI disc read, and a 1.3 GB Blu-ray
      # rip producing a valid MKV (#732). It has not been exercised on native ARM
      # hardware such as a Pi 5, only in an arm64 VM.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.version.outputs.IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
