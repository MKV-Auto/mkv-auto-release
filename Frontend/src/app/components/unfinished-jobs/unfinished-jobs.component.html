<button
  *ngFor="let job of jobs"
  class="unfinished-job-card glass card"
  [class.active]="currentJobId === job.jobId"
  (click)="onJobClick(job.jobId)">
  <div class="unfinished-job-card-top">
  <p class="eyebrow">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <path d="M16 13H8"></path>
      <path d="M16 17H8"></path>
      <path d="M10 9H8"></path>
    </svg>
    Unfinished disc
  </p>
  <div class="unfinished-job-card-content">
    <div class="unfinished-job-card-title">{{ getJobCardTitle(job) }}</div>
      <div class="unfinished-job-card-meta">{{ getJobMeta(job) }}</div>
    </div>
  </div>
  <div class="unfinished-job-card-bottom">
    <div class="unfinished-job-card-stage">{{ getJobStage(job) }}</div>
  </div>
</button>
