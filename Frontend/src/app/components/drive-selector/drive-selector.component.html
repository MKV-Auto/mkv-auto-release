<div class="animate-fade-in w-full">
  <ng-container *ngIf="drives === null">
    <div class="bg-white/5 border border-dashed border-white/20 rounded-xl text-slate-300 min-h-[100px] flex flex-col items-center justify-center p-4">
      <svg class="animate-spin opacity-70" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" opacity=".25"></circle>
        <path d="M22 12a10 10 0 0 1-10 10"></path>
      </svg>
      <span class="muted">Detecting drives…</span>
    </div>
  </ng-container>

  <ng-container *ngIf="drives !== null && drives.length === 0">
    <div class="bg-white/5 border border-dashed border-white/20 rounded-xl text-slate-300 min-h-[100px] flex items-center justify-center p-4">
      <div class="muted">No drives detected</div>
    </div>
  </ng-container>

  <ng-container *ngIf="drives?.length === 1">
    <div class="bg-white/5 border border-dashed border-white/20 rounded-xl text-slate-300 min-h-[100px] p-4">
      <span class="muted">Using drive:
        <strong>{{ drives[0].name || ('Drive ' + drives[0].disc_num) }}</strong>
      </span>
    </div>
  </ng-container>

  <ng-container *ngIf="drives && drives.length > 1">
    <div class="muted text-sm mb-2">Drives: {{ drives.length }}</div>
    <select
      [ngModel]="selectedDrive?.disc_num"
      (ngModelChange)="onChange($event)"
      class="w-full px-4 py-3 rounded-xl border border-white/20 bg-white/5 text-slate-200 text-base transition shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/25 focus:outline-none">
      <option disabled value="">Select a drive</option>
      <option *ngFor="let d of drives" [value]="d.disc_num">
        {{ d.name || ('Drive ' + d.disc_num) }}
      </option>
    </select>
  </ng-container>
</div>
