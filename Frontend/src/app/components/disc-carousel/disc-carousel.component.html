<div
  *ngFor="let card of allCards; trackBy: trackByCardId"
  class="disc-card-wrapper"
  [class.disabled]="card.type === 'drive' && (card.data.scan_state === 'pending' || card.data.scan_state === 'scanning' || driveScanState === 'scanning')"
  (click)="onCardClick(card); $event.stopPropagation()"
  (mouseenter)="onMouseEnter(card)"
  (mouseleave)="onMouseLeave(card)"
  (mousedown)="onMouseDown(card)">
<button
  type="button"
  class="disc-card glass card"
  [class.active]="isCardActive(card)"
  [class.loading]="isCardLoading(card)"
  [class.drive-card]="card.type === 'drive'"
  [class.job-card]="card.type === 'job'"
  [disabled]="card.type === 'drive' && (card.data.scan_state === 'pending' || card.data.scan_state === 'scanning' || driveScanState === 'scanning')"
  tabindex="-1">
  
  <!-- Drive Card Content -->
  <ng-container *ngIf="card.type === 'drive'">
    <div class="disc-card-top">
      <p class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Now Reading
      </p>
      <div class="disc-card-content" *ngIf="!isCardLoading(card)">
        <div class="disc-card-name">{{ getDiscTitle(card.data) }}</div>
        <div class="disc-card-meta">{{ getDiscMeta(card.data) }}</div>
      </div>
    </div>
    <div class="disc-card-bottom" *ngIf="!isCardLoading(card)">
      <div class="disc-card-mount">{{ getDriveMount(card.data) }}</div>
    </div>
    <div class="disc-card-loading" *ngIf="isCardLoading(card)">
      <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7" opacity=".25"></circle>
        <path d="M17 10a7 7 0 0 1-7 7"></path>
      </svg>
      <span>Loading...</span>
    </div>
  </ng-container>

  <!-- Job Card Content -->
  <ng-container *ngIf="card.type === 'job'">
    <div class="disc-card-top">
      <p class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <path d="M16 13H8"></path>
          <path d="M16 17H8"></path>
          <path d="M10 9H8"></path>
        </svg>
        Unfinished disc
      </p>
      <div class="disc-card-content">
        <div class="disc-card-name">{{ getDiscTitle(card.data) }}</div>
        <div class="disc-card-meta">{{ getDiscMeta(card.data) }}</div>
      </div>
    </div>
    <div class="disc-card-bottom">
      <div class="disc-card-stage">{{ getJobStage(card.data) }}</div>
    </div>
  </ng-container>
</button>
</div>
