<!-- Library release card (Phase 3 — #500).
     One card per standalone release. View / Edit / Expanded states. -->
<article class="library-release-card"
         [class.is-series]="isSeries"
         [class.is-editing]="editing"
         [class.is-expanded]="expanded"
         [class.is-nested]="nested"
         [attr.data-release-id]="release.id">

  <!-- Top row: poster + identity/meta + actions -->
  <div class="library-release-card__top">
    <div class="library-release-card__poster"
         [style.backgroundImage]="posterUrl ? 'url(' + posterUrl + ')' : null">
      <span *ngIf="!posterUrl" aria-hidden="true">
        {{ isSeries ? '📺' : '🎬' }}
      </span>
    </div>

    <!-- VIEW MODE: identity row -->
    <div *ngIf="!editing" class="library-release-card__identity">
      <div class="library-release-card__kind">
        {{ isSeries ? 'Series' : 'Movie' }}
        <span *ngIf="isFinalized" class="library-release-card__finalized" title="Release finalized — edits locked">✓ Finalized</span>
      </div>
      <h3 class="library-release-card__title" [title]="displayName">{{ displayName }}</h3>
      <div class="library-release-card__meta">
        {{ discCount }} disc{{ discCount === 1 ? '' : 's' }}
        <ng-container *ngIf="titleCount > 0">
          · {{ titleCount }} title{{ titleCount === 1 ? '' : 's' }}
        </ng-container>
      </div>
    </div>

    <!-- EDIT MODE: inline form -->
    <form *ngIf="editing"
          class="library-release-card__edit-form"
          (ngSubmit)="saveEdit()">
      <label class="library-release-card__field">
        <span class="library-release-card__label">Name</span>
        <input type="text"
               class="library-release-card__input"
               [(ngModel)]="editForm.release_name"
               name="release_name"
               placeholder="Release name"
               [disabled]="saving"
               required />
      </label>
      <label class="library-release-card__field library-release-card__field--year">
        <span class="library-release-card__label">Year</span>
        <input type="number"
               class="library-release-card__input"
               [(ngModel)]="editForm.release_year"
               name="release_year"
               placeholder="Year"
               min="1900"
               max="2100"
               [disabled]="saving" />
      </label>
      <label class="library-release-card__field library-release-card__field--full">
        <span class="library-release-card__label">Cover URL</span>
        <input type="url"
               class="library-release-card__input"
               [(ngModel)]="editForm.cover_front_url"
               name="cover_front_url"
               placeholder="https://…"
               [disabled]="saving" />
      </label>
      <p *ngIf="saveError" class="library-release-card__error">{{ saveError }}</p>
      <div class="library-release-card__edit-actions">
        <button type="submit"
                class="library-release-card__btn library-release-card__btn--primary"
                [disabled]="saving || !editForm.release_name?.trim()">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
        <button type="button"
                class="library-release-card__btn"
                (click)="cancelEdit()"
                [disabled]="saving">
          Cancel
        </button>
      </div>
    </form>

    <!-- Actions: shown in view mode only -->
    <div *ngIf="!editing" class="library-release-card__actions">
      <button type="button"
              class="library-release-card__btn"
              (click)="startEdit()"
              [disabled]="isFinalized"
              [title]="isFinalized ? 'Release finalized — edits locked' : 'Edit release metadata'"
              aria-label="Edit release">
        ✎ Edit
      </button>
      <button type="button"
              class="library-release-card__btn library-release-card__btn--danger"
              (click)="confirmDelete()"
              [disabled]="isFinalized"
              [title]="isFinalized ? 'Release finalized — cannot delete' : 'Delete release'"
              aria-label="Delete release">
        🗑 Delete
      </button>
      <button type="button"
              class="library-release-card__expand"
              (click)="toggleExpanded()"
              [attr.aria-expanded]="expanded"
              [attr.aria-label]="(expanded ? 'Collapse' : 'Expand') + ' disc list'">
        <span class="library-release-card__chev" [class.is-open]="expanded">▾</span>
      </button>
    </div>
  </div>

  <!-- Expanded body: disc list (placeholder rows for Phase 4 drawer to open) -->
  <ul *ngIf="expanded && discs.length > 0" class="library-release-card__discs">
    <li *ngFor="let disc of discs; trackBy: trackByDiscId"
        class="library-release-card__disc-row"
        [class.is-finalized]="discRowFinalized(disc)">
      <button type="button"
              class="library-release-card__disc-btn"
              (click)="openDisc(disc)"
              [attr.aria-label]="'Open ' + discRowLabel(disc) + ' details'">
        <span class="library-release-card__disc-label">{{ discRowLabel(disc) }}</span>
        <span class="library-release-card__disc-meta">{{ discRowMeta(disc) }}</span>
        <span *ngIf="discRowFinalized(disc)" class="library-release-card__disc-flag">✓</span>
      </button>
    </li>
  </ul>
  <p *ngIf="expanded && discs.length === 0"
     class="library-release-card__empty">No discs ripped yet for this release.</p>
</article>
