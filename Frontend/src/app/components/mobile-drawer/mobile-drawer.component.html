<!-- Drawer Container - will be moved to overlay when open -->
<div 
  class="mobile-drawer-wrapper">
  <div 
    class="mobile-drawer-container" 
    [class.open]="isOpen"
    (click)="onDrawerClick($event)"
    (mousedown)="onDrawerClick($event)"
    (touchstart)="onDrawerClick($event)">
    <!-- Handle bar (template TitleMobileDrawer) -->
    <div class="drawer-handle-bar">
      <div class="drawer-handle"></div>
    </div>
    <div class="drawer-header">
      <h3 class="drawer-title">{{ title }}</h3>
      <button 
        type="button"
        class="drawer-close-btn" 
        (click)="onClose()"
        aria-label="Close drawer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="drawer-content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
