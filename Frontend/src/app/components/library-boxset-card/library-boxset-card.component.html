<!-- Library boxset card (Phase 3 — #500).
     Wraps a list of nested library-release-card instances. -->
<article class="library-boxset-card"
         [class.is-editing]="editing"
         [class.is-expanded]="expanded"
         [attr.data-boxset-id]="boxset.id">

  <div class="library-boxset-card__top">
    <div class="library-boxset-card__poster"
         [style.backgroundImage]="posterUrl ? 'url(' + posterUrl + ')' : null">
      <span *ngIf="!posterUrl" aria-hidden="true">📦</span>
    </div>

    <!-- VIEW MODE -->
    <div *ngIf="!editing" class="library-boxset-card__identity">
      <div class="library-boxset-card__kind">Boxset</div>
      <h3 class="library-boxset-card__title" [title]="displayName">{{ displayName }}</h3>
      <div class="library-boxset-card__meta">
        {{ releaseCount }} release{{ releaseCount === 1 ? '' : 's' }}
        · {{ discCount }} disc{{ discCount === 1 ? '' : 's' }}
      </div>
      <!-- #741: the set-level split — a mixed set shows all three states. -->
      <div class="library-boxset-card__chips">
        <span *ngIf="readyCount > 0" class="library-boxset-card__chip library-boxset-card__chip--amber">⬆ {{ readyCount }} ready</span>
        <span *ngIf="changedCount > 0" class="library-boxset-card__chip library-boxset-card__chip--amber"
              title="In TheDiscDB, but your local edits differ — exporting submits updates">↻ {{ changedCount }} changed</span>
        <span *ngIf="inDbCount > 0 && changedCount === 0" class="library-boxset-card__chip library-boxset-card__chip--teal">✓ {{ inDbCount }} in DiscDB</span>
      </div>

    </div>

    <!-- EDIT MODE -->
    <form *ngIf="editing"
          class="library-boxset-card__edit-form"
          (ngSubmit)="saveEdit()">
      <label class="library-boxset-card__field">
        <span class="library-boxset-card__label">Name</span>
        <input type="text"
               class="library-boxset-card__input"
               [(ngModel)]="editForm.name"
               name="name"
               placeholder="Boxset name"
               [disabled]="saving"
               required />
      </label>
      <label class="library-boxset-card__field library-boxset-card__field--year">
        <span class="library-boxset-card__label">Year</span>
        <input type="number"
               class="library-boxset-card__input"
               [(ngModel)]="editForm.year"
               name="year"
               placeholder="Year"
               min="1900"
               max="2100"
               [disabled]="saving" />
      </label>
      <label class="library-boxset-card__field library-boxset-card__field--full">
        <span class="library-boxset-card__label">Cover URL</span>
        <input type="url"
               class="library-boxset-card__input"
               [(ngModel)]="editForm.cover_front_url"
               name="cover_front_url"
               placeholder="https://…"
               [disabled]="saving" />
      </label>
      <p *ngIf="saveError" class="library-boxset-card__error">{{ saveError }}</p>
      <div class="library-boxset-card__edit-actions">
        <button type="submit"
                class="library-boxset-card__btn library-boxset-card__btn--primary"
                [disabled]="saving || !editForm.name?.trim()">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
        <button type="button"
                class="library-boxset-card__btn"
                (click)="cancelEdit()"
                [disabled]="saving">
          Cancel
        </button>
      </div>
    </form>

    <!-- #741 UI: same kebab treatment as release cards. The export item is
         count-aware and skips discs already in TheDiscDB, so a mixed set never
         surprises. -->
    <div *ngIf="!editing" class="library-boxset-card__actions">
      <button type="button"
              class="library-boxset-card__kebab"
              [class.is-open]="menuOpen"
              (click)="toggleMenu($event)"
              [attr.aria-expanded]="menuOpen"
              aria-haspopup="menu"
              aria-label="Boxset actions">⋯</button>
      <button type="button"
              class="library-boxset-card__expand"
              (click)="toggleExpanded()"
              [attr.aria-expanded]="expanded"
              [attr.aria-label]="(expanded ? 'Collapse' : 'Expand') + ' release list'">
        <span class="library-boxset-card__chev" [class.is-open]="expanded">▾</span>
      </button>

      <div *ngIf="menuOpen" class="library-boxset-card__menu" role="menu">
        <button type="button" class="library-boxset-card__menu-item"
                (click)="onMenuEdit($event)" role="menuitem">
          <span aria-hidden="true">✎</span> Edit boxset
        </button>
        <button *ngIf="exportableDiscCount > 0" type="button"
                class="library-boxset-card__menu-item"
                (click)="onMenuExport($event)" role="menuitem">
          <span aria-hidden="true">⬆</span>
          Export set to TheDiscDB ({{ exportableDiscCount }} {{ exportableDiscCount === 1 ? 'disc' : 'discs' }})
        </button>
        <div class="library-boxset-card__menu-div" aria-hidden="true"></div>
        <button type="button"
                class="library-boxset-card__menu-item library-boxset-card__menu-item--danger"
                (click)="onMenuDelete($event)" role="menuitem">
          <span aria-hidden="true">🗑</span> Delete boxset…
        </button>
      </div>
    </div>
  </div>

  <!-- Nested releases -->
  <div *ngIf="expanded" class="library-boxset-card__releases">
    <p *ngIf="releases.length === 0" class="library-boxset-card__empty">
      No completed releases inside this boxset yet.
    </p>
    <app-library-release-card
      *ngFor="let rel of releases; trackBy: trackByReleaseId"
      [release]="rel"
      [discs]="getDiscsForRelease(rel)"
      [nested]="true"
      [eligibleDiscIds]="eligibleDiscIds"
      [updateDiscIds]="updateDiscIds"
      (exportDiscs)="exportDiscs.emit($event)"
      (updated)="onReleaseUpdated($event)"
      (deleted)="onReleaseDeleted($event)"
      (discOpen)="onDiscOpen($event)">
    </app-library-release-card>
  </div>
</article>
