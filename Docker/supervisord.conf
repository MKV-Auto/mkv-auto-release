[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root
loglevel=info

# PostgreSQL (embedded mode - disabled if external DB used)
[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres -c config_file=/etc/postgresql/15/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
priority=10
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true

# Database migrations (runs once after PostgreSQL starts).
# #709: db-migrate.sh snapshots the DB before applying pending migrations and
# writes a failure sentinel (read by the API readiness gate) if a migration
# fails, so the app never serves a half-migrated database.
[program:migrations]
command=/app/db-migrate.sh
autostart=true
autorestart=false
stdout_logfile=/var/log/supervisor/migrations.log
stderr_logfile=/var/log/supervisor/migrations_err.log
priority=15
startsecs=0
exitcodes=0

# Redis (embedded mode - disabled if external Redis used)
[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
user=redis
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=20
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true

# Udev daemon for disc detection
[program:udevd]
command=/usr/lib/systemd/systemd-udevd --debug
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/udevd.log
stderr_logfile=/var/log/supervisor/udevd_err.log
priority=25
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true

# NGINX
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
priority=30
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true

# FastAPI Backend (Uvicorn)
[program:uvicorn]
command=/app/venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_DATA="/data/mkvauto/data",MKVAUTO_TMP_DIR="/data/mkvauto/tmp",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/uvicorn.log
stderr_logfile=/var/log/supervisor/uvicorn_err.log
priority=40
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true

# Celery: separate queues (see workers.tasks task_routes). Rip concurrency also limited by one_at_a_time.
[program:celery-rip]
command=/app/venv/bin/celery -A workers.tasks worker -Q rip -c 5 --loglevel=info
directory=/app/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_DATA="/data/mkvauto/data",MKVAUTO_TMP_DIR="/data/mkvauto/tmp",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/data/mkvauto/logs/celery_rip.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/mkvauto/logs/celery_rip.log
redirect_stderr=true
priority=50
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true

[program:celery-postprocess]
command=/app/venv/bin/celery -A workers.tasks worker -Q postprocess -c 5 --loglevel=info
directory=/app/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_DATA="/data/mkvauto/data",MKVAUTO_TMP_DIR="/data/mkvauto/tmp",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/data/mkvauto/logs/celery_postprocess.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/mkvauto/logs/celery_postprocess.log
redirect_stderr=true
priority=51
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true

[program:celery-transfer]
command=/app/venv/bin/celery -A workers.tasks worker -Q transfer -c 5 --loglevel=info
directory=/app/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_DATA="/data/mkvauto/data",MKVAUTO_TMP_DIR="/data/mkvauto/tmp",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/data/mkvauto/logs/celery_transfer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/mkvauto/logs/celery_transfer.log
redirect_stderr=true
priority=52
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true

[program:celery-preview]
command=/app/venv/bin/celery -A workers.tasks worker -Q preview -c 5 --loglevel=info
directory=/app/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_DATA="/data/mkvauto/data",MKVAUTO_TMP_DIR="/data/mkvauto/tmp",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/data/mkvauto/logs/celery_preview.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/mkvauto/logs/celery_preview.log
redirect_stderr=true
priority=53
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true

# Default queue: cleanup_zombies, cleanup_job_mkv, reconcile_job_mkv_cleanup, load_disc_info (no rip).
[program:celery]
command=/app/venv/bin/celery -A workers.tasks worker -Q celery -c 2 --loglevel=info
directory=/app/backend
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_DATA="/data/mkvauto/data",MKVAUTO_TMP_DIR="/data/mkvauto/tmp",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/data/mkvauto/logs/celery.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/data/mkvauto/logs/celery.log
redirect_stderr=true
priority=54
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true

# Root Helper (privileged operations)
[program:root-helper]
command=/app/venv/bin/python /app/backend/root_update_helper.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",MAKEMKV_ROOT_HELPER_SOCK="/tmp/makemkv_auto.sock",MKVAUTO_ROOT="/data/mkvauto",MKVAUTO_TMP_DIR="/data/mkvauto/tmp"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/root_helper.log
stderr_logfile=/var/log/supervisor/root_helper_err.log
priority=60
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
