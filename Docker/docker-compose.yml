# Docker Compose for MKV-Auto
# Simple deployment with embedded PostgreSQL and Redis

version: '3.8'

services:
  mkv-auto:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: mkv-auto
    ports:
      - "8080:80"
    volumes:
      # Persistent data
      - mkv-data:/data
    devices:
      # Optical drive access (adjust device path as needed).
      - /dev/sr0
    # Required. Beyond mount operations, this is what gives the container the
    # /dev/sg* (SCSI generic) nodes — MakeMKV enumerates drives through those,
    # not through /dev/sr*, and without them it reports no usable optical
    # drives at all. There is deliberately no `- /dev/sgN` line here: under
    # privileged the container receives every host device node, and a static
    # list would go stale the moment drive numbering changed. If a drive is
    # not detected, see docs/HOST_OPTICAL_SETUP.md § "Drive not detected at
    # all" — the usual cause is host-side, not this file.
    privileged: true
    environment:
      # Optional: Override default timezone
      - TZ=UTC
      # Optional: Set log level (DEBUG, INFO, WARNING, ERROR)
      - MKVAUTO_DEBUG_LEVEL=INFO
      # Optional: configure the app itself, so a fresh container comes up ready
      # with no setup wizard. Re-applied on every start, so editing a value here
      # and restarting changes it — which is also why anything set here is shown
      # read-only in the web UI. Leave a line out to manage that setting in the UI.
      # Full list: docs/Guides/CONFIGURATION.md#unattended-setup-application-settings
      # - MKVAUTO_MAKEMKV_KEY=${MAKEMKV_KEY}
      # - MKVAUTO_TMDB_API_KEY=${TMDB_KEY}
      # - MKVAUTO_MEDIA_SERVER=plex
      # - MKVAUTO_AUTO_RIP=false
      # - MKVAUTO_EJECT_ON_FINISH=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mkv-data:
    driver: local
